<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Celestia Accessories</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0a;--gold:#d4af37;--text:#e8e8e8;--muted:#888;--card:#141414;--border:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2.5rem 2rem;max-width:420px;width:100%}
h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--gold);text-align:center;margin-bottom:.5rem;font-weight:600}
p.sub{color:var(--muted);text-align:center;font-size:.85rem;margin-bottom:1.5rem}
label{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.75rem;border-radius:6px;font-family:inherit;font-size:.9rem;margin-bottom:1rem}
input:focus{outline:none;border-color:var(--gold)}
button{width:100%;background:var(--gold);color:var(--bg);border:none;padding:.85rem;border-radius:6px;font-family:inherit;font-weight:500;font-size:.9rem;cursor:pointer;letter-spacing:.05em;text-transform:uppercase}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:1rem;padding:.75rem;border-radius:6px;font-size:.85rem;text-align:center;display:none}
.msg-err{background:rgba(231,76,60,.1);border:1px solid #e74c3c;color:#e74c3c}
.msg-ok{background:rgba(212,175,55,.1);border:1px solid var(--gold);color:var(--gold)}
.back{display:block;text-align:center;margin-top:1.5rem;color:var(--muted);text-decoration:none;font-size:.8rem}
.back:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
  <h1>Reset Password</h1>
  <p class="sub" id="sub">Choose a new password for your Celestia account.</p>

  <div id="form">
    <label for="pw1">New Password</label>
    <input type="password" id="pw1" placeholder="At least 6 characters" autocomplete="new-password">
    <label for="pw2">Confirm New Password</label>
    <input type="password" id="pw2" placeholder="Type it again" autocomplete="new-password">
    <button id="btn" onclick="submitReset()">Update Password</button>
  </div>

  <div id="msg"></div>
  <a href="/" class="back">← Back to Celestia</a>
</div>

<script>
const SUPABASE_URL='https://hbhrbdvwtbquskdgohem.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiaHJiZHZ3dGJxdXNrZGdvaGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNTE2NjUsImV4cCI6MjA5ODkyNzY2NX0.4RwwQmG4hdO8U4FB6doVvWyMtatG9RpEi3OSfRGe-js';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const msg=document.getElementById('msg');
const form=document.getElementById('form');
const sub=document.getElementById('sub');
const showErr=(m)=>{msg.textContent=m;msg.className='msg-err';msg.style.display='block'};
const showOk=(m)=>{msg.textContent=m;msg.className='msg-ok';msg.style.display='block'};

// Supabase v2 puts the recovery token in the URL hash and auto-signs the user in via detectSessionInUrl.
// We just need to wait for the session, then let them set a new password.
let hasSession=false;
(async()=>{
  // Give the SDK a beat to consume the hash tokens
  await new Promise(r=>setTimeout(r,300));
  const {data:{session}}=await sb.auth.getSession();
  if(session){hasSession=true;return}
  // Sometimes the event fires slightly later
  sb.auth.onAuthStateChange((event,sess)=>{
    if(sess){hasSession=true}
    if(event==='PASSWORD_RECOVERY'){hasSession=true}
  });
  // After a short wait, if still no session, warn
  setTimeout(async()=>{
    const {data:{session:s2}}=await sb.auth.getSession();
    if(!s2){
      form.style.display='none';
      sub.textContent='';
      showErr('This reset link is invalid or has expired. Please request a new one from the login page.');
    }
  },1500);
})();

async function submitReset(){
  const pw1=document.getElementById('pw1').value;
  const pw2=document.getElementById('pw2').value;
  const btn=document.getElementById('btn');
  msg.style.display='none';
  if(pw1.length<6)return showErr('Password must be at least 6 characters.');
  if(pw1!==pw2)return showErr('Passwords do not match.');
  btn.disabled=true;btn.textContent='Updating...';
  try{
    const {error}=await sb.auth.updateUser({password:pw1});
    if(error){btn.disabled=false;btn.textContent='Update Password';return showErr(error.message||'Could not update password.')}
    form.style.display='none';
    sub.textContent='';
    showOk('Password updated! Redirecting you to sign in...');
    setTimeout(()=>{window.location.href='/'},2000);
  }catch(e){
    btn.disabled=false;btn.textContent='Update Password';
    showErr('Network error. Please try again.');
  }
}
</script>
</body>
</html>
